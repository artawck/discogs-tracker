name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['20.x', '22.x']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          # Tests never launch the headless browser bundled with
          # discogs-marketplace-api-nodejs, so skip its (large) Chromium
          # download to keep installs fast.
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      - name: Run tests
        run: npm test

  build:
    name: Build (${{ matrix.os }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          # electron-builder only needs the Chromium *wrapper* code (it's
          # asar-unpacked as-is); the actual browser binary isn't needed to
          # verify packaging succeeds.
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      - name: Build the app
        run: npm run dist -- --publish=never
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
          # Without a signing identity configured, electron-builder's default
          # auto-discovery can fail the build looking for one that doesn't
          # exist on these runners.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
